name: Verify desktop Markdown tables
on:
  push:
    branches: [work/markdown-desktop-fix]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/nextchina-table-source.tgz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nextchina-table-source
          path: /tmp/nextchina-table-source.tgz
          retention-days: 1
