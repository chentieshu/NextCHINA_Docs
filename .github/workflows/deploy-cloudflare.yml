name: Deploy NextCHINA Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nextchina-docs-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate and build
        run: npm run build
      - name: Install browser for rendering tests
        run: npx playwright install --with-deps chromium
      - name: Verify Markdown, diagrams and garden interactions
        run: npm run test:browser -- --workers=2
      - name: Verify production chunks and layout worker
        run: npm run test:production -- --workers=2
      - name: Upload rendering diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-diagnostics
          path: |
            test-results/
            test-results-production/
          retention-days: 7
      - name: Deploy static assets with Wrangler
        run: npm run deploy:assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live release identity
        run: node scripts/verify-deployment.mjs
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOYMENT_URL: https://docs.nextchina.org
