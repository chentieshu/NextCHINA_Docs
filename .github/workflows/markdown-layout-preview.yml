name: Verify Markdown responsive layout
on:
  push:
    branches: [work/markdown-responsive-audit]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=/tmp/markdown-layout-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-layout-source
          path: /tmp/markdown-layout-source.zip
          retention-days: 1
