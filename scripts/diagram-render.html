<!doctype html><html><head><meta charset="utf-8"><title>Build-time Mermaid renderer</title></head><body style="margin:0;width:1200px"><div id="stage"></div>
<script type="module">
import mermaid from '/node_modules/mermaid/dist/mermaid.esm.min.mjs';
import { diagramTheme } from '/src/lib/diagramTheme.js';
window.renderBuildDiagram = async (source, light, id) => {
  await document.fonts.ready;
  mermaid.initialize(diagramTheme(light));
  await mermaid.parse(source);
  const stage = document.getElementById('stage');
  stage.replaceChildren();
  const { svg } = await mermaid.render(id, source, stage);
  stage.innerHTML = svg;
  const drawing = stage.querySelector('svg');
  const { width, height } = drawing.viewBox.baseVal;
  if (!(width > 0 && height > 0)) throw new Error('Invalid diagram geometry');
  drawing.removeAttribute('height');
  drawing.removeAttribute('style');
  return { svg: drawing.outerHTML, width, height, id };
};
</script></body></html>
