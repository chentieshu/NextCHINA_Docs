name: Validate garden application

on:
  push:
    branches: [work/ai-garden]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/work/ai-garden'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and resolve reproducible dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate and build static site
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test existing articles and garden browser interactions
        run: npm run test:browser
      - name: Test production chunks and ELK worker
        run: npm run test:production
      - name: Upload diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-browser-report
          path: test-results/
          retention-days: 7
      - name: Record generated lockfile on this implementation branch only
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Lock tested dependency graph for the knowledge garden'
            git push origin HEAD:work/ai-garden
          fi
