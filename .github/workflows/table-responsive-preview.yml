name: Verify responsive table redesign
on:
  push:
    branches: [work/table-responsive-redesign]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify table redesign before regressions
        run: npx playwright test tests/browser/workspace-tables-responsive.spec.ts tests/browser/markdown-layout.spec.ts
      - name: Verify existing pages and interactions
        run: npm run test:browser
      - name: Verify production bundles
        run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-responsive-verification
          path: |
            test-results/
            test-results-production/
          retention-days: 7
