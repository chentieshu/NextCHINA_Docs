name: Verify desktop Markdown tables
on:
  push:
    branches: [work/markdown-desktop-fix]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Desktop, phone, typography and full document inventory
        run: npx playwright test tests/browser/markdown-layout.spec.ts tests/browser/workspace-markdown.spec.ts tests/browser/workspace-table-typography.spec.ts
      - name: Production work area and table geometry
        run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-tables-verified
          path: |
            test-results/
            test-results-production/
          retention-days: 7
