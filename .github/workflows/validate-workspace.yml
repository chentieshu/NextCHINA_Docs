name: Validate workspace interface

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'content/**'
      - 'scripts/**'
      - 'package*.json'
      - '*config*'
      - 'AGENTS.md'
      - '.github/workflows/validate-workspace.yml'
  workflow_dispatch:

concurrency:
  group: workspace-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Build and verify homepage and reader
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Preserve tracked source for reproducible review
        run: git archive --format=zip --output=review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-source-snapshot
          path: review-source.zip
          retention-days: 7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Preserve the exact review build for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-map-preview
          path: dist/
          retention-days: 7
      - name: Check all Markdown, navigation, graph and responsive interactions
        run: npm run test:browser -- --workers=2
      - name: Check the actual production build
        run: npm run test:production -- --workers=2
      - name: Preserve browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-interface-diagnostics
          path: |
            test-results/
            test-results-production/
            src/generated/markdown-assets.json
          retention-days: 7
