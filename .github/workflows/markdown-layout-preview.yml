name: Verify Markdown responsive layout
on:
  push:
    branches: [work/markdown-responsive-audit]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify documents, diagrams, tables and workspace
        run: npm run test:browser
      - name: Verify production workspace and layout worker
        run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-responsive-verification
          path: |
            test-results/
            test-results-production/
          retention-days: 7
