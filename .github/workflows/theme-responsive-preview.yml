name: Verify theme and responsive workspace
on:
  push:
    branches: [work/theme-responsive-audit]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=/tmp/theme-audit-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: theme-audit-source
          path: /tmp/theme-audit-source.zip
          retention-days: 1
