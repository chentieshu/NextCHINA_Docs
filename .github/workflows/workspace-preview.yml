name: Verify unified knowledge workspace
on:
  push:
    branches: [work/unified-knowledge-workspace]
permissions:
  contents: read
concurrency:
  group: workspace-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify workspace interactions before full regression
        run: npx playwright test tests/browser/workspace.spec.ts
      - name: Verify all Markdown and diagram rendering
        run: npm run test:browser
      - name: Verify production workspace and layout worker
        run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-ux-verification
          path: |
            test-results/
            test-results-production/
          retention-days: 7
