name: Validate workspace interface

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'content/**'
      - 'scripts/**'
      - 'package*.json'
      - '*config*'
      - '.github/workflows/validate-workspace.yml'
  workflow_dispatch:

concurrency:
  group: workspace-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Build and verify homepage and reader
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check workspace navigation and home in development
        run: npx playwright test tests/browser/workspace.spec.ts tests/browser/workspace-links.spec.ts tests/browser/workspace-home.spec.ts --workers=2
      - name: Check actual production chunks and graph worker
        run: npx playwright test --config=playwright.production.config.ts tests/browser/workspace.spec.ts tests/browser/workspace-links.spec.ts tests/browser/workspace-home.spec.ts --workers=2
      - name: Preserve browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-interface-diagnostics
          path: |
            test-results/
            test-results-production/
          retention-days: 7
