name: Apply reviewed knowledge patch

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.release/**'
      - '.github/workflows/apply-reviewed-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/verified-knowledge-release' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify and apply reviewed patch
        run: |
          cat .release/part-*.bin | xz -dc > "$RUNNER_TEMP/knowledge.patch"
          echo "a54ba3edf784bb52dd66c16b1b753a0284f546e59e19e2741b507dd6607635a5  $RUNNER_TEMP/knowledge.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/knowledge.patch"
          git apply "$RUNNER_TEMP/knowledge.patch"
          git rm .release/part-*.bin
          git add .gitignore content docs package.json scripts src tests vite.config.ts
          git -c user.name='NextCHINA release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "feat: evidence-backed knowledge, direct explanations and honest graph admission"
          git push origin HEAD:fix/verified-knowledge-release
