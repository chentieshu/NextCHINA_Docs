name: Verify theme and responsive workspace
on:
  push:
    branches: [work/theme-responsive-audit]
permissions:
  contents: read
concurrency:
  group: theme-responsive-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Theme, breakpoint and interaction regression
        run: npm run test:browser
      - name: Production asset and workspace regression
        run: npm run test:production
      - name: Rebuild source inventory after browser output cleanup
        if: always()
        run: npm run audit:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-audit
          path: |
            test-results/
            test-results-production/
          retention-days: 7
