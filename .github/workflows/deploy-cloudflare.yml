name: Deploy NextCHINA Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nextchina-docs-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate and build
        run: npm run build
      - name: Install browser for rendering tests
        run: npx playwright install --with-deps chromium
      - name: Verify diagrams and flat UI in Chromium
        run: npm run test:browser
      - name: Upload rendering diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-diagnostics
          path: test-results/
          retention-days: 7
      - name: Deploy static assets with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
